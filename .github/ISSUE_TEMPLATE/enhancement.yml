# Improvement form, the stopgap until the org Project board exists. CLAUDE.md, "Work tracking", wins over this file:
# a feature or improvement is a card in Ideas on the coloradostartups-site Project, and an issue labeled enhancement
# only while the gh login lacks the project scope. Paul, 2026-11-03: cards are visual first, tables and numbers over
# prose. Delete this form once cards can be filed.
name: Improvement
description: A feature or improvement. It becomes a Project card once the board exists.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Fill the table. Numbers and paths, not sentences.
  - type: textarea
    id: table
    attributes:
      label: Table
      description: One row per fact. A picture or chart beats a row.
      value: |
        | Item | Value |
        | --- | --- |
        | Change | |
        | Metric | name, now, goal |
        | Where | URL, or path |
        | Done when | |
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick one, and add the matching area label.
      options:
        - code
        - documentation
        - design
        - usability
        - security
        - ci
    validations:
      required: true
