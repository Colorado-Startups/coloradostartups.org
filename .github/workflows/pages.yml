name: pages

# ADVISORY. The repo's public Process page and Quality, Speed and Consumption page, from Git Crafter templates/ci/pages.yml at
# v7.0.0: Git Crafter's actions/pages builds both from quality/config.json (with the Claudius pack) and
# quality/process/config.json, and GitHub Pages publishes them at colorado-startups.github.io/coloradostartups.org/.
# A pull request builds the pages and runs the docs.unmapped gate, so its trigger lists the doc globs; only main
# publishes. The daily run keeps the scores fresh between merges. ADMIN_READ_TOKEN (API-Key-GitHub-AdminRead, a
# fine-grained read-only token) reaches the collect step on main only, so a pull request's code never sees it; unset,
# the metrics that need it read not measured. The repo's own leak scan checks the built pages before upload.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.md"
      - "quality/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A deploy always finishes; a newer run queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The collectors read this repo's pull requests, runs, checks and issues; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      vulnerability-alerts: read
    steps:
      # Full history: the docs collector dates each doc against its area's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: SoulCraft-Org/git-crafter/actions/pages@a9d6b45b7e5ac54091123e2cda1efcfcd2f63696 # v7.0.0
        with:
          pages: process quality
          config: quality/process/config.json
          quality-config: quality/config.json
          admin-read-token: ${{ github.ref == 'refs/heads/main' && secrets.ADMIN_READ_TOKEN || '' }}

      # The built pages are public: the repo's own leak scan (names, private repos, keys) runs on them first.
      - name: Leak scan the built pages
        run: python3 04_tools/export_scan.py quality/dist --public-checks-only

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: quality/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
