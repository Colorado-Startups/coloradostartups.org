name: secret-scan

# ADVISORY until a ruleset requires the secret-scan check; the orchestrator
# merges only when every check is green.
#
# gitleaks over the commits the run answers for (04_tools/secret_scan.sh): on
# a pull request its own commits, on a push to main every ancestor of the
# pushed commit. A credential that a later commit removed still fails the run.
# Other branches are no longer read, so a false positive on one branch fails
# only that branch's pull request. Values are redacted in the log; a finding prints its
# file, commit and rule id. It runs the MIT gitleaks release binary, not
# gitleaks/gitleaks-action, which needs a licence for organization repos.
# The tarball is pinned by version and by the SHA-256 from that release's
# gitleaks_8.30.1_checksums.txt (read 2026-11-02); a mismatch never installs.
# Identical copies run in other repos in the org: move the version and
# the SHA-256 in all of them together.
#
# No schedule: with the binary pinned, rerunning an unchanged history finds
# nothing new. No event input reaches a run: step.
#
# Path filter (#577): a change made only of images and fonts starts no
# run. gitleaks reads text: a binary file's diff carries no lines for its
# rules, so such a change has nothing to scan. Any other file starts the scan.
on:
  pull_request:
    paths-ignore:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.avif"
      - "**/*.gif"
      - "**/*.ico"
      - "**/*.woff"
      - "**/*.woff2"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.webp"
      - "**/*.avif"
      - "**/*.gif"
      - "**/*.ico"
      - "**/*.woff"
      - "**/*.woff2"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Pushes to main share one
# group and are never cancelled: a running check finishes, and in a burst of
# merges only the newest waiting push runs next. It scans the full history, so
# its verdict covers every push it replaced.
# A replaced run never gets a runner, so it bills nothing: Actions bills runner
# processing time (docs.github.com, "GitHub Actions billing"). Decision in #532;
# per-SHA push groups reverse it.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    # ubuntu-slim: this job takes seconds; gitleaks' pinned linux_x64 binary runs there too, and GitHub bills every job a whole minute, so the 1-vCPU runner
    # at a third of ubuntu-latest's per-minute price costs a third as much (ops/ci/compute-plan.md, step 4).
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip
          persist-credentials: false

      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # 04_tools/secret_scan.sh holds the scan: on a pull request the PR's own
      # commits (base..head), otherwise every ancestor of the pushed commit.
      # Its self-test runs the real binary in a throwaway repo: a key on
      # another branch is ignored, and a key inside the pull request's own
      # commits fails though a later commit deleted it. The fake key is built
      # at run time.
      - name: Self-test (the scan's range, with a planted fake key)
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: bash 04_tools/secret_scan.sh --self-test

      - name: Scan the commits this run answers for
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash 04_tools/secret_scan.sh . "$PR_BASE" "${PR_HEAD:-$GITHUB_SHA}"

      # gitleaks skips any line with its inline allow marker, so the marker
      # may sit only where 04_tools/gitleaks_allow.json says (#774): in the
      # tree, and on every line a commit in this run's range adds, even one a
      # later commit deletes. On a pull request the base commit's checker and
      # list judge it, and that checker also validates the pull request's
      # list, so a pull request cannot widen or loosen its own; a base
      # without them (the pull request that adds them) uses this one's. A
      # push reads before..after; a dispatch, the tree alone. Exit 3 warns
      # through ci_gate.sh.
      - name: Allow-marker self-test (throwaway repos, no network)
        if: ${{ !cancelled() }}
        run: python3 -I 04_tools/gitleaks_allow.py --self-test

      - name: The allow marker appears only where the allowlist says
        if: ${{ !cancelled() }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          checker=04_tools/gitleaks_allow.py; list=04_tools/gitleaks_allow.json; range=""
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
            if git cat-file -e "$PR_BASE:$checker" 2>/dev/null; then
              git show "$PR_BASE:$checker" > "$RUNNER_TEMP/gitleaks_allow.py"
              git show "$PR_BASE:$list" > "$RUNNER_TEMP/gitleaks_allow.json"
              checker="$RUNNER_TEMP/gitleaks_allow.py"; list="$RUNNER_TEMP/gitleaks_allow.json"
              bash 04_tools/ci_gate.sh python3 -I "$checker" --check-list 04_tools/gitleaks_allow.json
            fi
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          fi
          bash 04_tools/ci_gate.sh python3 -I "$checker" --root . --allowlist "$list" ${range:+--range "$range"}
