# AI-visibility panel: questions people ask an assistant about starting up
# in Colorado. 20 is the goal count for the panel, not a quota.
#
# Rules for every question (panel.ts parseQuestions() and
# test/questions.test.ts enforce the first two):
#   - Never name Colorado Startups or coloradostartups.org. The panel
#     measures whether the assistant brings us up unprompted.
#   - Never use the phrase "Colorado startups". An answer that echoes it in a
#     title-case heading would read as a mention of the organization.
#   - Name no other organization. A named organization steers the answer.
#   - Phrase it the way a person types it: plain, first person, no jargon.
#
# Fields:
#   id      v01..v20, stable across runs so months can be compared
#   topic   community | founders | resources | lookup | accelerators | region | events
#   region  statewide | denver-boulder | colorado-springs | fort-collins
#
# Changing a question breaks comparison with earlier months. Add a new id
# instead, and keep the old one until a full month has run on both.

