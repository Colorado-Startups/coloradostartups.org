id: space-peak-connector
title: Space Peak Connector
kind: region
region: Space Peak
eyebrow: Colorado Springs and the Pikes Peak region
where: Colorado Springs and the towns around Pikes Peak
one_liner: Be the friendly face at Colorado Springs startup events, meet everybody, and connect Space Peak founders with each other and with the rest of the state.
do:
  - Go to as many startup events in Colorado Springs and the Pikes Peak region as you can.
  - Greet newcomers, and introduce them to the people they should know.
  - Connect Space Peak founders with founders in Photon Mountain and Fusion Canyon.
  - Have coffee with people who raise their hand to help, and match them to a project.
  - Invite the people you meet to the Slack, the Startupers newsletter and the next event.
  - Follow up within two days with the next step you promised.
  - Share local wins with the whole community.
bring:
  - You love meeting people, and you love introducing them to each other.
  - You love building, and you like being around people who build.
  - You can get to events in Colorado Springs, from Monument to Fountain.
  - You are curious about what people are building, and you ask good questions.
