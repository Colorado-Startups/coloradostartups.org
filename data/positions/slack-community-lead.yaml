id: slack-community-lead
title: Slack Community Lead
kind: community
eyebrow: Online, statewide
where: Online, across Colorado
one_liner: Make the Colorado Startups Slack the first place a Colorado founder goes to ask for help and share a win.
do:
  - Welcome new members and point each one to the right channel.
  - "Keep the weekly threads lively: Monday Welcome, Wednesday Asks and Offers, and Friday Colorado Wins."
  - Keep threads on topic, and step in kindly when the Code of Conduct needs it.
  - Work beside Communitas, the AI agent that greets new members and opens the weekly threads, and tell us where it gets things wrong.
  - Spot founder wins and asks worth sharing in the Startupers newsletter.
  - Shape new channels and programming with Paul as the community grows.
bring:
  - You are in Slack most days, and you enjoy it.
  - You like helping strangers feel at home.
  - You stay calm and fair when a thread gets heated.
  - You care about the founders building companies in Colorado.
rules_extra:
  - People moderate this Slack. Communitas never does, so the judgment calls are yours.
