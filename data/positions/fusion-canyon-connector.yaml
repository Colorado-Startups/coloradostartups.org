id: fusion-canyon-connector
title: Fusion Canyon Connector
kind: region
region: Fusion Canyon
eyebrow: Fort Collins and Northern Colorado
where: Fort Collins and Northern Colorado
one_liner: Be the friendly face at Fort Collins startup events, meet everybody, and connect Northern Colorado founders with each other and with the rest of the state.
do:
  - Go to as many startup events in Fort Collins and Northern Colorado as you can.
  - Greet newcomers, and introduce them to the people they should know.
  - Connect Northern Colorado founders with founders in Photon Mountain and Space Peak.
  - Have coffee with people who raise their hand to help, and match them to a project.
  - Invite the people you meet to the Slack, the Startupers newsletter and the next event.
  - Follow up within two days with the next step you promised.
  - Share local wins with the whole community.
bring:
  - You love meeting people, and you love introducing them to each other.
  - You love building, and you like being around people who build.
  - You can get to events in Fort Collins, Loveland, Windsor and Greeley.
  - You are curious about what people are building, and you ask good questions.
