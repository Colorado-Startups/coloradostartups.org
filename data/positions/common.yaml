perks:
  - Your name, photo and bio on the Colorado Startups Team page.
  - A title you can list on LinkedIn under Volunteer experience, and a LinkedIn recommendation from Paul at the end of your term.
  - Coffees with founders and event tickets reimbursed against receipts, within a budget we agree when you start.
  - A one-year term. At the end, we both decide whether to renew.
  - Claude Academy badges, and the skills behind them.
steps:
  - title: Tell us why
    body: Write a few lines on why this role excites you and what you would bring to it. Excitement is the first requirement.
  - title: Earn the Claude Academy badges
    body: Take each course for your seat on Claude Academy and pass its quiz. Each badge is free with a free Claude account. When you pass, open the badge and copy its verification link.
  - title: Meet Paul
    body: Send your note and your badge links. If it looks like a fit, Paul sets up an interview, and you walk through the role description together.
look_for:
  - You make people feel welcome, especially the person standing alone.
  - You ask about the other person first, and you listen.
  - You follow through. When you promise an intro or a next step, it happens within two days.
  - You know what to handle yourself and what to send to Paul.
rules_common:
  - Everyone is welcome. No one should leave a conversation with you feeling like an outsider.
  - Never promise Paul's time, money, investment, sponsorship, event slots or a role.
  - Send VIPs, investors, sponsors, press and elected officials to Paul, with one line on what they want.
linkedin_rule: On LinkedIn, list the role under Volunteer experience with Colorado Startups as the organization. Colorado Startups is not your employer.
course_lengths_read: "2026-10-18"
