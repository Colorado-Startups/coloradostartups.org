id: photon-mountain-connector
title: Photon Mountain Connector
kind: region
region: Photon Mountain
eyebrow: Boulder, Denver, Golden
where: Boulder, Denver and Golden
one_liner: Go to the startup events in Boulder, Denver and Golden, meet everybody, and connect the founders of all three cities.
do:
  - Go to as many startup events in Boulder, Denver and Golden as you can.
  - Meet founders where they are, and introduce them to the people they should know.
  - Be the link between the three cities, so a Golden founder meets the Boulder engineer they need.
  - Have coffee with people who raise their hand to help, and match them to a project.
  - Invite the people you meet to the Slack, the Startupers newsletter and the next event.
  - Follow up within two days with the next step you promised.
  - Share local wins with the whole community.
bring:
  - You love meeting people, and you love introducing them to each other.
  - You love building, and you like being around people who build.
  - You can get to events in Boulder, Denver and Golden.
  - You are curious about what people are building, and you ask good questions.
rules_extra:
  - When someone asks about Startup Hikes, Startup Ski Days or the Welcome to Boulder and Denver events, point them to the Startup Community Project's Luma calendar.
extra_courses:
  - ai-fluency-for-small-businesses
