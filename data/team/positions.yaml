- id: resources-curator
  title: Startup Resources curator
  area: project
  summary: Keep the Startup Resources directory accurate and useful for founders.
  what_you_do:
    - Review suggested resources.
    - Check links and descriptions.
    - Flag gaps a founder would notice.
  status: open

- id: startupers-contributor
  title: Startupers contributor
  area: project
  summary: Help the Startupers newsletter tell the stories of Colorado founders.
  what_you_do:
    - Send founder wins, lessons and events worth sharing.
    - Help draft editions for review.
  status: open

- id: website-maintainer
  title: Website maintainer
  area: project
  summary: Help steer coloradostartups.org. Review changes, guide new contributors and keep the site fast, safe and kind.
  what_you_do:
    - Approve and merge pull requests that wait for a maintainer, except the merge policy and gates.
    - Help new contributors pick a good first issue and land it.
    - Turn accepted ideas into issues.
  status: open
