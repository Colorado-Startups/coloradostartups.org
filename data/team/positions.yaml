- id: fusion-canyon-connector
  title: Fusion Canyon Connector
  area: region
  region: fusion-canyon
  summary: Meet the founders of Fort Collins, Loveland, Windsor and Greeley. Learn to work with AI, and carry the Fusion Canyon Connector title on LinkedIn.
