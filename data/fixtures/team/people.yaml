# Fixture people for builds with no access to the private people repo: local
# dev, fork CI and the public repo. Every name is fake on purpose. The real
# Team page builds from Colorado-Startups/coloradostartups-people (open-source
# plan, phase 1). scripts/people/overlay.mjs copies this file to
# data/team/people.yaml and photos/ to site/src/components/team/photos/ when
# the real data is not there. Same groups as the real file: one leader, one
# community helper, two thanked.

- id: ada-example
  name: Ada Example
  title: Founder & President
  group: leadership
  bio: >-
    Ada is a fixture. The real Team page shows the people who run Colorado
    Startups; this card shows where a leader's bio goes.
  photo: ada-example
  links:
    - label: Website
      href: https://example.org/ada

