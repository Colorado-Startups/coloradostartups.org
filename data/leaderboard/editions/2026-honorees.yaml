id: 2026-honorees
title: "2026 Honorees"
kind: honorees
published: "2026-10-18"
summary: "The companies on the 2026 Overall, Startup and Community Picks boards that Colorado Startups could verify from public sources. This edition is unranked and lists companies A to Z."
method: "The 2026 Honorees start from the companies on our 2026 boards. For each one, we read its own website and press coverage. We recorded its headquarters city, its sector, a one-line description we wrote, and its founding year when a source states it. Every company links to the pages we used. A company is listed when a source shows a Colorado headquarters or a Colorado office; when the headquarters is elsewhere, the table names that city and state. We left out investment firms, university programs and companies we could not verify. This edition uses no outside ranking data. To correct a listing, write to info@coloradostartups.org."
