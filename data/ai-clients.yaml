# AI clients that can connect to the keyless MCP server at /mcp.
# site/src/pages/connect.astro renders one card per record, in this order.
#
# effort: one-click (a deep link opens the app's install prompt),
#         one-command (paste one line in a terminal),
#         guided (a few steps in the app's settings).
# install:
#   deeplink: the page builds the link from the /mcp URL; format names the
#             vendor's documented form (cursor, vscode or goose).
#   command:  {url} is replaced with the /mcp URL.
#   config:   JSON the page fills with the /mcp URL (opencode only).
#   steps:    the app's own menu names, in order.
# docs: where the form was read; read: the date it was read.

- id: claude
  name: Claude
  effort: guided
  steps:
    - Customize › Connectors › + Add › Add custom connector
    - Name it, paste the URL, then Continue
    - "Authentication: No sign in, then Add"
  docs: https://support.claude.com
  read: 2026-11-15

- id: chatgpt
  name: ChatGPT
  effort: guided
  steps:
    - Plugins › + › Add custom MCP server
    - Name it and paste the URL under Connection
    - "Authentication: none, then Create as a plugin"
  docs: https://developers.openai.com/apps-sdk/deploy/connect-chatgpt
  read: 2026-11-16

- id: cursor
  name: Cursor
  effort: one-click
  deeplink: cursor
  docs: https://cursor.com/docs
  read: 2026-11-15

- id: vscode
  name: VS Code
  effort: one-click
  deeplink: vscode
  docs: https://code.visualstudio.com
  read: 2026-11-15

- id: goose
  name: Goose
  effort: one-click
  deeplink: goose
  docs: https://goose-docs.ai
  read: 2026-11-15

- id: claude-code
  name: Claude Code
  effort: one-command
  command: claude mcp add --transport http coloradostartups {url}
  docs: https://code.claude.com/docs
  read: 2026-11-15

- id: opencode
  name: OpenCode
  effort: one-command
  command: opencode mcp add coloradostartups --url {url}
  config: opencode
  docs: https://opencode.ai/docs/mcp-servers
  read: 2026-11-16
