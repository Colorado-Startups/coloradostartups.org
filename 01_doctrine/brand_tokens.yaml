# The Hall: design tokens for coloradostartups.org (v3, brand decision 51).
# One definition. site/scripts/sync-brand.mjs generates site/src/styles/tokens.css
# from this file on every dev and build; test/unit/brand-tokens-sync.test.ts
# fails if the generated file drifts. Edit here, never in tokens.css.
#
# Direction (brand v3, decision 51; Paul, "State palette leads"): the State of
# Colorado palette in the Hall's role names. The color block is a copy of
# Colorado-Startups/brand dist/tokens.json (light set) at the tag in
# brand.lock.json; test/unit/brand-tokens-sync.test.ts fails if a value drifts.
#   Ground is white and text is State Blue. State Yellow is a fill behind Blue
#   text, never text on white. State Red carries links, underlined at rest.
#   Teal carries community links. Night is State Blue taken near black, for
#   the footer and city-lights bands, where Yellow and white text sit.
# Hall materials keep their role names (stone, bronze, brass, molten), so
# components still name what a surface is made of, not its hex.
#
# Contrast: every text and UI pairing is listed in the contrast block at the end,
# with its WCAG 2.2 ratio. test/unit/l12/contrast.test.ts recomputes each ratio
# from the hex values here and fails if one drifts or drops below its minimum.
#
# Lengths (#330, 2026-11-02): a length the components repeat is a token here:
# space, radius, line, size and type. A one-off ornament (a rivet, a finial, a
# keystone) is written in rem in its own rule, so it scales with the reader's
# text size and still draws the same at the default 16 px root.

color:
  ground: "#FFFFFF"           # page ground
  surface: "#F2F4F8"          # panels and cards
  surface-2: "#E6E8F1"        # raised surface, hover and section band
  rule: "#D6DAE8"             # decorative rules only, never a UI boundary
  border: "#6675A9"           # form fields and UI boundaries
  text: "#001970"             # body text
  text-dim: "#384C8F"         # secondary text
  accent: "#FFD100"           # fill for buttons and highlights
  accent-deep: "#E0B800"      # pressed accent
  on-accent: "#001970"        # text on Yellow
  link: "#C3002F"             # links
  community: "#35647E"        # community links and tags
  fire: "#C3002F"             # warm accent for decoration and large text
  focus: "#001970"            # keyboard focus ring
  danger: "#C3002F"           # form errors
  night: "#000A33"            # dark band for footers and city lights
  on-night: "#FFFFFF"         # text on the night band
  on-night-dim: "#B8C2E8"     # secondary text on the night band
  gold-on-night: "#FFD100"    # links and accents on the night band
  brand-teal: "#35647E"       # logo context only
  brand-purple: "#6D3A5D"     # logo context only
  stone: "#E3E9ED"            # carved stone face for lintels and stone panels
  stone-edge: "#AEC1CB"       # carved edge and the ledge under stone, decoration only
  bronze: "#6D3A5D"           # secondary buttons and plaques
  bronze-deep: "#4E2A43"      # bronze ledge and pressed bronze
  on-bronze: "#FFFFFF"        # text on bronze
  accent-ledge: "#B29200"     # the forged ledge under Yellow, decoration only
  molten: "#FFE673"           # highlight in gradients
  brass: "#7A853B"            # gears and rivets, decoration only
  focus-on-night: "#FFD100"   # keyboard focus ring on the night band
  danger-on-night: "#E48CA1"  # errors on the night band
  night-ceiling: "#001970"    # lightest pixel a night-stone tile may paint, decoration only
  sky-wash: "#EBF0F2"         # badge ground for community ink
  copper-wash: "#FAEBEE"      # badge ground for link ink
  pine: "#245D38"             # ink for nature and green status
  pine-wash: "#E9EFEB"        # badge ground for pine ink
# Night: the dark theme (brand v3, Colorado-Startups/brand dist/tokens.css).
# Each role's night value from the brand's tokens.json, where the brand gives
# one under $extensions; a role not listed keeps its light value. The page
# follows the reader's system setting, and data-theme="light" or "dark" on
# <html> pins one. test/unit/brand-tokens-sync.test.ts fails if a value drifts.
night:
  ground: "#000A33"
  surface: "#061450"
  surface-2: "#0D1F66"
  rule: "#26357A"
  border: "#7482C2"
  text: "#F4F6FF"
  text-dim: "#B8C2E8"
  link: "#FFD100"
  community: "#86A2B2"
  fire: "#DE738D"
  focus: "#FFD100"
  danger: "#E48CA1"
  night: "#00061F"
  stone: "#0A1A5C"
  stone-edge: "#3A4A8F"
  sky-wash: "#101E26"
  copper-wash: "#37000D"
  pine: "#87A692"
  pine-wash: "#0B1C11"
# Old names from the dark v1 palette, kept so lane code written against them
# still renders. New code uses the names above; these go away after Wave 2.
alias:
  deepstone: ground
  granite: surface
  granite-2: surface-2
  strata: rule
  border-strong: border
  quartz: text
  quartz-dim: text-dim
  gold: accent
  gold-deep: accent-deep
  ember: fire
  glacier: community
  twilight: brand-purple

space:
  "1": "4px"
  "2": "8px"
  "3": "12px"
  "4": "16px"
  "5": "24px"
  "6": "32px"
  "7": "48px"
  "8": "64px"
  "9": "96px"

radius:
  chisel: "4px"            # buttons, inputs: cut stone, not pills
  card: "10px"             # panels and image frames
  none: "0"
  # Chamfer depths. Where corner-shape is supported, corners are cut flat
  # (bevel); elsewhere these radii round them a little.
  bevel: "14px"            # stone panels, cards, callouts
  bevel-sm: "8px"          # buttons and badges

# Line widths, for borders, rules, underlines and focus rings (#330).
line:
  hair: "1px"              # field borders, chips, carved grooves; a link's resting underline
  edge: "2px"              # carved edges of panels, cards and buttons; a hovered link's underline
  bold: "3px"              # the focus ring, gilded edges, gold and ember rules, a hovered card title

# Fixed sizes for depth, targets, controls and the page column (#330).
size:
  ledge: "4px"             # depth of the solid ledge under a raised material
  ring-offset: "3px"       # gap between an element and its focus ring
  tap: "44px"              # smallest standalone target (WCAG 2.2 SC 2.5.5, 44 by 44)
  control: "48px"          # button height
  control-lg: "56px"       # hero button height
  check: "1.25rem"         # checkbox and radio box: rem, never the control font's em
  wrap: "1180px"           # widest content column

shadow:
  glow: "0 10px 30px rgb(0 25 112 / 0.16)"         # soft State Blue glow under raised items
  edge: "inset 0 1px 0 rgb(255 255 255 / 0.6)"     # lit top edge on panels
  # Solid ledges, not soft grey shadows: the chunky painted depth of the Hall.
  ledge: "0 var(--size-ledge) 0 var(--c-stone-edge)"         # under carved stone
  ledge-gold: "0 var(--size-ledge) 0 var(--c-accent-ledge)"  # under forged gold
  ledge-bronze: "0 var(--size-ledge) 0 var(--c-bronze-deep)" # under hammered bronze

type:
  # The classic scale (Bringhurst): 15, 18, 21, 24, 36, 48, 60, 72 px.
  step--1: "0.9375rem"
  step-0: "1.125rem"
  step-1: "1.3125rem"
  step-2: "1.5rem"
  step-3: "2.25rem"
  step-4: "3rem"
  step-5: "3.75rem"
  step-6: "4.5rem"
  measure: "68ch"

# Every text and UI pairing the components use, with its WCAG 2.2 contrast
# ratio (recomputed 2026-11-15 from the brand v3 hex values above). min is 4.5 for body
# text, 3 for large text and for UI parts such as borders and focus rings.
# test/unit/l12/contrast.test.ts recomputes each ratio and fails on any drift.
contrast:
  - { fg: text, bg: ground, ratio: 15.29, min: 4.5 }
  - { fg: text, bg: surface, ratio: 13.89, min: 4.5 }
  - { fg: text, bg: surface-2, ratio: 12.51, min: 4.5 }
  - { fg: text, bg: stone, ratio: 12.49, min: 4.5 }
  - { fg: text-dim, bg: ground, ratio: 8.08, min: 4.5 }
  - { fg: text-dim, bg: surface, ratio: 7.34, min: 4.5 }
  - { fg: text-dim, bg: surface-2, ratio: 6.61, min: 4.5 }
  - { fg: text-dim, bg: stone, ratio: 6.60, min: 4.5 }
  - { fg: link, bg: ground, ratio: 6.25, min: 4.5 }
  - { fg: link, bg: surface, ratio: 5.67, min: 4.5 }
  - { fg: link, bg: surface-2, ratio: 5.11, min: 4.5 }
  - { fg: link, bg: stone, ratio: 5.10, min: 4.5 }
  - { fg: community, bg: ground, ratio: 6.41, min: 4.5 }
  - { fg: community, bg: surface, ratio: 5.82, min: 4.5 }
  - { fg: community, bg: surface-2, ratio: 5.24, min: 4.5 }
  - { fg: community, bg: stone, ratio: 5.23, min: 4.5 }
  - { fg: danger, bg: surface, ratio: 5.67, min: 4.5 }
  - { fg: danger, bg: ground, ratio: 6.25, min: 4.5 }
  - { fg: danger, bg: stone, ratio: 5.10, min: 4.5 }
  - { fg: on-accent, bg: accent, ratio: 10.47, min: 4.5 }
  - { fg: on-accent, bg: molten, ratio: 12.25, min: 4.5 }
  - { fg: on-accent, bg: accent-deep, ratio: 8.03, min: 4.5 }
  - { fg: on-bronze, bg: bronze, ratio: 8.70, min: 4.5 }
  - { fg: on-bronze, bg: bronze-deep, ratio: 12.10, min: 4.5 }
  - { fg: ground, bg: link, ratio: 6.25, min: 4.5 }
  - { fg: ground, bg: community, ratio: 6.41, min: 4.5 }
  - { fg: on-night, bg: night, ratio: 19.24, min: 4.5 }
  - { fg: on-night-dim, bg: night, ratio: 10.92, min: 4.5 }
  - { fg: gold-on-night, bg: night, ratio: 13.17, min: 4.5 }
  - { fg: danger-on-night, bg: night, ratio: 7.85, min: 4.5 }
  - { fg: community, bg: sky-wash, ratio: 5.58, min: 4.5 }
  - { fg: link, bg: copper-wash, ratio: 5.41, min: 4.5 }
  - { fg: pine, bg: pine-wash, ratio: 6.68, min: 4.5 }
  - { fg: border, bg: ground, ratio: 4.48, min: 3 }
  - { fg: border, bg: surface, ratio: 4.07, min: 3 }
  - { fg: border, bg: stone, ratio: 3.66, min: 3 }
  - { fg: focus, bg: ground, ratio: 15.29, min: 3 }
  - { fg: focus, bg: surface, ratio: 13.89, min: 3 }
  - { fg: focus, bg: stone, ratio: 12.49, min: 3 }
  - { fg: focus-on-night, bg: night, ratio: 13.17, min: 3 }

